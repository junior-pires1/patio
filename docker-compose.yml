# PostgreSQL 16 para desenvolvimento: `docker compose up -d`
# Cria os bancos patio (desenvolvimento) e patio_teste (testes automatizados).
services:
  banco:
    image: postgres:16
    container_name: patio-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: patio
      POSTGRES_PASSWORD: patio
      POSTGRES_DB: patio
    ports:
      - '5432:5432'
    volumes:
      - dados:/var/lib/postgresql/data
      - ./docker/criar-banco-de-teste.sql:/docker-entrypoint-initdb.d/criar-banco-de-teste.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patio']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados:
